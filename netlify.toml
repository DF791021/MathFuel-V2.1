[build]
  command = "pnpm install && pnpm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"
  PNPM_VERSION = "10.4.1"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
